<!doctype html>
<!--
  Ember Clash - Web shell.

  This is the static page that hosts the Emscripten-compiled game. The
  Emscripten build (build-web/bin/EmberClash.html) is auto-generated by
  `emcc` from the Emscripten-side default shell; this file is the
  *custom* shell we use in production:

    * It points at the Emscripten artifacts (EmberClash.js + .wasm) that
      live next to it in build-web/bin/ when you run the game locally,
      or in your hosting bucket when you ship.
    * It renders a centred dark-navy canvas with a "Click to start"
      prompt so the first keyboard event after page load still gets to
      SDL3 (browsers don't deliver key events to a canvas that hasn't
      been clicked at least once).
    * It exposes a fixed canvas size that matches the desktop build's
      logical resolution (config::kWindowWidth x kWindowHeight, currently
      1280 x 720). If you want a different render size, change the
      constants in src/Core/Config.h AND the CSS width/height below; the
      Emscripten build does not magically follow your CSS box.

  How to use:
    1. From the project root, build the web target:
         emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
         cmake --build build-web
       (See README.md "Build (WebAssembly / Emscripten)" for the full
       one-time install steps.)
    2. Copy build-web/bin/EmberClash.{js,wasm} (and the .data file if
       Emscripten emits one) next to this index.html.
    3. Serve this directory over HTTP. The simplest local option:
         cd build-web/bin
         python -m http.server 8000
       then open http://localhost:8000/  (or ./index.html).

  No build step reads or rewrites this file - it is hand-maintained
  and is the only checked-in HTML in the whole project (see the
  whitelist lines in .gitignore).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ember Clash</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0e1a;        /* matches config::kClearColor */
      color: #e6e6e6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #game-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #game-canvas-wrap {
      position: relative;
      width:  1280px;             /* matches config::kWindowWidth */
      height: 720px;              /* matches config::kWindowHeight */
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
    }
    #game-canvas-wrap canvas {
      width:  100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0a0e1a;        /* matches kClearColor until first paint */
      cursor: pointer;
    }
    #start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      background: rgba(10, 14, 26, 0.85);
      cursor: pointer;
      user-select: none;
    }
    #start-overlay h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin: 0;
    }
    #start-overlay p {
      font-size: 1rem;
      opacity: 0.7;
      margin: 0;
    }
    /* Once the canvas has focus, hide the overlay so the game is visible. */
    body.playing #start-overlay { display: none; }
  </style>
</head>
<body>
  <div id="game-root">
    <div id="game-canvas-wrap">
      <canvas id="canvas" tabindex="0"></canvas>
      <div id="start-overlay" role="button" tabindex="0"
           aria-label="Click to start Ember Clash">
        <h1>Ember Clash</h1>
        <p>Click to start &middot; WASD / Arrows to move &middot; Esc to quit</p>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    // Emscripten's SDL3 port looks for Module.canvas and will attach its
    // WebGL/canvas2d context to it. We have to set Module.canvas BEFORE
    // loading EmberClash.js (the Emscripten runtime reads it at
    // instantiation time).
    var Module = {
      canvas: (function () { return document.getElementById('canvas'); })(),
      // Surface uncaught SDL/runtime errors in the dev console. Emscripten
      // is happy to call this even in production; we leave it on.
      print:    function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      // SDL3 wants a "user gesture" (click / key press) before it can
      // start producing audio. We grant the gesture when the user clicks
      // the start overlay; before that, SDL's audio subsystem is happy
      // to be silent. The game does not currently use audio, but
      // initialising the gesture hook now means future audio work
      // (Music + SFX) won't need a shell change.
      preRun:   []
    };
  </script>

  <!-- The Emscripten-compiled runtime. Emscripten copies this file to
       the same directory as the shell when you run a build with the
       default shell template. With a custom shell, the .js / .wasm
       land in the binary directory (build-web/bin/ for local builds,
       or alongside this index.html once you copy them up to your
       hosting bucket). Keep this script tag at the end of <body> so
       document.getElementById('canvas') resolves at load time. -->
  <script async src="EmberClash.js"></script>

  <script>
    // Hide the start overlay the moment the user has clicked or pressed
    // a key. The actual SDL key events still come through as long as
    // the canvas has tabindex=0 and at least one user gesture has
    // happened in the document.
    (function () {
      var body = document.body;
      var overlay = document.getElementById('start-overlay');
      function start() {
        body.classList.add('playing');
        var c = document.getElementById('canvas');
        if (c && c.focus) c.focus();
      }
      if (overlay) {
        overlay.addEventListener('click', start);
        overlay.addEventListener('keydown', start);
      }
      window.addEventListener('keydown', function once() {
        start();
        window.removeEventListener('keydown', once);
      });
    })();
  </script>
</body>
</html>
